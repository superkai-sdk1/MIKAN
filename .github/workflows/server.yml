# The server's typecheck and tests on every change to the server or its contract (docs/API.md).
name: server

on:
  push:
    paths:
      - 'server/**'
      - 'docs/API.md'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docs/API.md'
      - '.github/workflows/server.yml'

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still going.
concurrency:
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
